<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="diplomacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc71ff"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <!-- Two hands shaking / bridging -->
  <path d="M16 32 Q24 24 32 32 Q40 40 48 32" stroke="url(#diplomacyGrad)" stroke-width="2.5" fill="none" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;70" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M16 32 Q24 40 32 32 Q40 24 48 32" stroke="url(#diplomacyGrad)" stroke-width="2.5" fill="none" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="70;0" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Hand shapes -->
  <g stroke="url(#diplomacyGrad)" stroke-width="2" fill="none">
    <!-- Left hand -->
    <path d="M16 32 Q12 28 10 24 Q8 20 10 16 Q12 12 16 12 Q20 12 20 16" opacity="0.7"/>
    <path d="M10 24 L8 20" opacity="0.6"/>
    <path d="M10 16 L8 12" opacity="0.6"/>
    <!-- Right hand -->
    <path d="M48 32 Q52 28 54 24 Q56 20 54 16 Q52 12 48 12 Q44 12 44 16" opacity="0.7">
      <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M54 24 L56 20" opacity="0.6"/>
    <path d="M54 16 L56 12" opacity="0.6"/>
  </g>
  <!-- Connection nodes -->
  <circle cx="24" cy="28" r="3" fill="#bc71ff" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="28" r="3" fill="#00f3ff" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="36" r="3" fill="#ff6b35" opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Data flow lines -->
  <g stroke="url(#diplomacyGrad)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M24 28 Q28 30 32 28">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M40 28 Q36 30 32 28">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M32 28 L32 36">
      <animate attributeName="stroke-dashoffset" values="0;8" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Globe outline behind -->
  <circle cx="32" cy="32" r="26" stroke="url(#diplomacyGrad)" stroke-width="0.8" fill="none" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="32" cy="32" rx="26" ry="8" stroke="url(#diplomacyGrad)" stroke-width="0.8" fill="none" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="15s" repeatCount="indefinite"/>
  </ellipse>
</svg>