<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="tuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#bc71ff"/>
    </linearGradient>
    <radialGradient id="glowTu" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="60" r="80" fill="url(#glowTu)"/>
  <!-- Hair - elegant updo -->
  <path d="M55 70 Q50 45 80 40 Q100 35 120 40 Q150 45 145 70 Q145 90 130 105 Q100 115 70 105 Q55 90 55 70" fill="#0d111a" opacity="0.95"/>
  <path d="M65 70 Q65 50 100 45 Q135 50 135 70" fill="#1a1f2e" opacity="0.8"/>
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="55" ry="70" fill="url(#tuGrad)" opacity="0.1" stroke="url(#tuGrad)" stroke-width="1"/>
  <!-- Eyes - gentle, wise -->
  <ellipse cx="82" cy="98" rx="6" ry="3.5" fill="#39ff14" opacity="0.8">
    <animate attributeName="ry" values="3.5;0.5;3.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="118" cy="98" rx="6" ry="3.5" fill="#39ff14" opacity="0.8">
    <animate attributeName="ry" values="0.5;3.5;0.5" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Eyebrows -->
  <path d="M70 88 Q82 84 94 88" fill="none" stroke="#0d111a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M106 88 Q118 84 130 88" fill="none" stroke="#0d111a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Nose -->
  <path d="M100 108 Q98 118 100 118" fill="none" stroke="url(#tuGrad)" stroke-width="1" opacity="0.5"/>
  <!-- Smile -->
  <path d="M88 128 Q100 132 112 128" fill="none" stroke="url(#tuGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Traditional collar -->
  <path d="M60 145 Q60 165 100 185 Q140 165 140 145" fill="#0d111a" stroke="url(#tuGrad)" stroke-width="1.5"/>
  <path d="M85 150 Q100 160 115 150" fill="none" stroke="url(#tuGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <!-- Artemisia annua leaves -->
  <g fill="#39ff14" opacity="0.7">
    <path d="M30 50 Q35 40 45 45 Q40 55 30 50"><animateTransform attributeName="transform" type="rotate" from="0 30 50" to="360 30 50" dur="20s" repeatCount="indefinite"/></path>
    <path d="M170 55 Q175 45 185 50 Q180 60 170 55"><animateTransform attributeName="transform" type="rotate" from="360 170 55" to="0 170 55" dur="18s" repeatCount="indefinite"/></path>
    <path d="M25 155 Q30 145 40 150 Q35 160 25 155"><animateTransform attributeName="transform" type="rotate" from="0 25 155" to="-360 25 155" dur="22s" repeatCount="indefinite"/></path>
    <path d="M175 160 Q180 150 190 155 Q185 165 175 160"><animateTransform attributeName="transform" type="rotate" from="-360 175 160" to="0 175 160" dur="19s" repeatCount="indefinite"/></path>
  </g>
  <!-- Molecular structure hint -->
  <g stroke="#39ff14" stroke-width="1" opacity="0.4">
    <circle cx="100" cy="165" r="15" fill="none"><animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="165" r="8" fill="none"><animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/></circle>
    <line x1="100" y1="150" x2="100" y2="135" stroke-dasharray="2 2"><animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/></line>
    <line x1="100" y1="180" x2="100" y2="195" stroke-dasharray="2 2"><animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/></line>
    <line x1="85" y1="165" x2="70" y2="165" stroke-dasharray="2 2"><animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/></line>
    <line x1="115" y1="165" x2="130" y2="165" stroke-dasharray="2 2"><animate attributeName="stroke-dashoffset" values="0;10" dur="2s" repeatCount="indefinite"/></line>
  </g>
  <!-- Nobel -->
  <circle cx="100" cy="175" r="10" fill="none" stroke="url(#tuGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 175" to="360 100 175" dur="18s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="179" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="7" font-weight="700" fill="url(#tuGrad)" opacity="0.5">NOBEL 2015</text>
</svg>