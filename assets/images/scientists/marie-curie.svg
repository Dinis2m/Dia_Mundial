<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="curieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc71ff"/>
      <stop offset="50%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <radialGradient id="glowCurie" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#bc71ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bc71ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="100" cy="60" r="80" fill="url(#glowCurie)"/>
  <!-- Face silhouette - stylized -->
  <ellipse cx="100" cy="110" rx="55" ry="70" fill="url(#curieGrad)" opacity="0.15" stroke="url(#curieGrad)" stroke-width="1.5"/>
  <!-- Hair -->
  <path d="M55 70 Q50 50 70 45 Q100 40 130 45 Q150 50 145 70 Q145 90 130 105 Q100 115 70 105 Q55 90 55 70" fill="#1a1f2e" opacity="0.9"/>
  <path d="M65 70 Q60 55 80 52 Q100 50 120 52 Q140 55 135 70" fill="#0d111a" opacity="0.7"/>
  <!-- Collar/Clothing -->
  <path d="M55 140 Q55 160 100 180 Q145 160 145 140" fill="#0d111a" stroke="url(#curieGrad)" stroke-width="1"/>
  <path d="M80 145 L100 165 L120 145" fill="none" stroke="url(#curieGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes - subtle glow -->
  <ellipse cx="82" cy="95" rx="6" ry="4" fill="#bc71ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="118" cy="95" rx="6" ry="4" fill="#bc71ff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Nose -->
  <path d="M100 105 L98 115 L102 115" fill="none" stroke="url(#curieGrad)" stroke-width="1" opacity="0.5"/>
  <!-- Mouth -->
  <path d="M90 125 Q100 128 110 125" fill="none" stroke="url(#curieGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Radiation symbol particles -->
  <g fill="#bc71ff" opacity="0.7">
    <circle cx="30" cy="40" r="2"><animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="50" r="1.5"><animate attributeName="r" values="1;2.5;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="25" cy="160" r="2"><animate attributeName="r" values="1;3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="175" cy="170" r="1.5"><animate attributeName="r" values="1;2.5;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Nobel medal hint -->
  <circle cx="100" cy="165" r="12" fill="none" stroke="url(#curieGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 165" to="360 100 165" dur="20s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="169" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="8" font-weight="700" fill="url(#curieGrad)" opacity="0.5">NOBEL ×2</text>
</svg>