<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="doudnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc71ff"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
    <radialGradient id="glowDoudna" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#bc71ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bc71ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="60" r="80" fill="url(#glowDoudna)"/>
  <!-- Hair - modern, shoulder-length -->
  <path d="M55 70 Q45 55 60 45 Q80 38 100 35 Q120 38 140 45 Q155 55 145 70 Q145 100 130 115 Q100 125 70 115 Q55 100 55 70" fill="#2d1a3d" opacity="0.95"/>
  <path d="M70 70 Q65 52 100 48 Q135 52 130 70" fill="#1a0d26" opacity="0.8"/>
  <!-- Face -->
  <ellipse cx="100" cy="110" rx="55" ry="70" fill="url(#doudnaGrad)" opacity="0.1" stroke="url(#doudnaGrad)" stroke-width="1"/>
  <!-- Eyes - sharp, focused -->
  <ellipse cx="82" cy="98" rx="6" ry="3.5" fill="#bc71ff" opacity="0.9">
    <animate attributeName="ry" values="3.5;0.3;3.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="118" cy="98" rx="6" ry="3.5" fill="#bc71ff" opacity="0.9">
    <animate attributeName="ry" values="0.3;3.5;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Eyebrows -->
  <path d="M70 88 Q82 83 94 88" fill="none" stroke="#2d1a3d" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M106 88 Q118 83 130 88" fill="none" stroke="#2d1a3d" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Nose -->
  <path d="M100 108 Q98 118 100 118" fill="none" stroke="url(#doudnaGrad)" stroke-width="1" opacity="0.5"/>
  <!-- Confident smile -->
  <path d="M88 128 Q100 134 112 128" fill="none" stroke="url(#doudnaGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Collar - modern lab coat -->
  <path d="M55 145 Q55 165 100 185 Q145 165 145 145" fill="#ffffff" opacity="0.1" stroke="url(#doudnaGrad)" stroke-width="1.5"/>
  <path d="M80 150 L100 170 L120 150" fill="none" stroke="url(#doudnaGrad)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- CRISPR double helix -->
  <g stroke="url(#doudnaGrad)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M30 60 Q40 50 50 55 Q60 60 55 70 Q50 80 60 85 Q70 90 65 100">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M40 60 Q50 50 60 55 Q70 60 65 70 Q60 80 70 85 Q80 90 75 100">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Base pairs -->
    <g stroke="#39ff14" stroke-width="1.5" opacity="0.8">
      <line x1="38" y1="65" x2="52" y2="65"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/></line>
      <line x1="42" y1="80" x2="58" y2="80"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/></line>
      <line x1="35" y1="95" x2="49" y2="95"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/></line>
    </g>
  </g>
  <!-- Cas9 protein scissors -->
  <g transform="translate(150, 140)" opacity="0.7">
    <path d="M0 0 L-15 -20 M0 0 L15 -20" stroke="url(#doudnaGrad)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="d" values="M0 0 L-15 -20 M0 0 L15 -20; M0 0 L-10 -15 M0 0 L10 -15; M0 0 L-15 -20 M0 0 L15 -20" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#doudnaGrad)" stroke-width="1.5" stroke-dasharray="3 3">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- DNA bases floating -->
  <g font-family="Space Grotesk, sans-serif" font-size="10" font-weight="700" fill="url(#doudnaGrad)" opacity="0.5">
    <text x="20" y="160" text-anchor="middle"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite">A</animate></text>
    <text x="180" y="155" text-anchor="middle"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite">T</animate></text>
    <text x="25" y="45" text-anchor="middle"><animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite">G</animate></text>
    <text x="175" y="50" text-anchor="middle"><animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.2s" repeatCount="indefinite">C</animate></text>
  </g>
  <!-- Nobel -->
  <circle cx="100" cy="172" r="10" fill="none" stroke="url(#doudnaGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 172" to="360 100 172" dur="14s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="176" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="7" font-weight="700" fill="url(#doudnaGrad)" opacity="0.5">NOBEL 2020</text>
</svg>